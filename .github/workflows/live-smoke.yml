name: Live demo smoke (ecommerce.aito.ai)

# Opens every view on the DEPLOYED site, read-only (GETs only), and fails if one
# errors OR comes back hollow. On 29.9 every route answered 200 while Churn had
# no drivers, Demand no seasonality, and Evaluation served a stale "fail".
# Board td-20260929184223822327.

on:
  schedule:
    - cron: '45 2 * * *'           # 05:45 EEST / 04:45 EET: outside the 08-10 demo window
  workflow_dispatch: {}
  repository_dispatch:
    types: [demos-deployed]         # fired after a demos deploy
  push:
    branches: [main]
    paths: ['scripts/live_smoke.py', '.github/workflows/live-smoke.yml']

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pick the host the deploy targeted
        id: target
        env:
          # the payload arrives through env vars, never interpolated into the script
          DEPLOY_ENV: ${{ github.event.client_payload.env }}
          IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
          IMAGE_ID: ${{ github.event.client_payload.image_id }}
          DIGEST: ${{ github.event.client_payload.digest }}
        run: |
          BASE="https://ecommerce.aito.ai"
          if [ "$DEPLOY_ENV" = "test" ]; then
            BASE="https://ecommerce-test.aito.ai"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Verifying ${DEPLOY_ENV:-prod (scheduled/manual)} at $BASE: image ${IMAGE_TAG:-n/a} (${DIGEST:-n/a}), built ${IMAGE_ID:-n/a}"
      - name: Smoke the ecommerce demo on that host (read-only)
        if: steps.target.outputs.base != ''
        env:
          BASE: ${{ steps.target.outputs.base }}
        run: python scripts/live_smoke.py --base "$BASE"
