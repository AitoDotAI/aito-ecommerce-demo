name: Tests

# The offline unit tests: every test that needs no reachable Aito. The live checks (`./do aito-check`,
# tests/test_live_smoke.py, tests/test_claims_live.py) skip or stay out, so a green run here does not
# prove the live checks ran; they run where Aito is reachable (the live-smoke workflow, `./do check`).

on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders: the offline tests send no request to Aito.
      AITO_API_URL: https://example.invalid
      AITO_API_KEY: not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The image installs only the project's own dependencies (`--no-dev`): the app has to import with just those. A package the
      # app imports but lists only under a group passes every test here and crash-loops in the image (numpy, 2026-11-01).
      - name: The app imports with only the project's own dependencies
        run: |
          UV_PROJECT_ENVIRONMENT=/tmp/bare-env uv sync --frozen --no-dev
          UV_PROJECT_ENVIRONMENT=/tmp/bare-env AITO_SKIP_STARTUP_WARMUP=1 uv run --no-sync python -c "import src.app"
      - run: uv sync --frozen
      # impressions.json and contexts.json are generated, not committed (byte-stable: tests/test_generation_is_byte_stable.py)
      - run: uv run python -m data.generate_fixtures
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: uv run pytest tests -q --ignore=tests/test_aito_check.py --ignore=tests/test_live_smoke.py --ignore=tests/test_claims_live.py
